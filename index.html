<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#faf9f6" />

    <title>Thong Huynh — Robotics Engineer</title>
    <meta
      name="description"
      content="Thong Huynh is a robotics engineer working in robotics, AI and automation — autonomous mobile robots, computer vision inspection systems and digital twins."
    />
    <meta name="author" content="Thong Huynh" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thong Huynh — Robotics Engineer" />
    <meta
      property="og:description"
      content="Robotics, AI and automation. Autonomous mobile robots, computer vision inspection systems and digital twins."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // The page is locked at 1:1 — no pinch, no double-tap, in either
      // direction. iOS Safari has ignored user-scalable in the viewport tag
      // since iOS 10, and only honours the CSS touch-action on the root for
      // some gestures, so its own pinch events are refused here as well.
      // Android and the rest are covered by the meta tag and touch-action.
      (function () {
        var refuse = function (event) {
          event.preventDefault();
        };

        ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
          document.addEventListener(name, refuse, { passive: false });
        });
      })();

      // Runs before first paint so a returning dark-mode visitor never sees a
      // white flash. The site defaults to light; only an explicit choice from
      // the toggle, remembered here, turns it dark.
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
